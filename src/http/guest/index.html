<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yellow secure deposit</title><link rel="stylesheet" href="/assets/guest.css"></head>
<body><main data-hosted-deposit-status aria-live="polite"><p class="eyebrow">Yellow secure deposit</p>
<h1>Review your deposit</h1><section class="card" aria-busy="true"><p id="message">Loading verified details…</p>
<dl hidden><div><dt>Property</dt><dd id="property"></dd></div><div><dt>Folio</dt><dd id="folio"></dd></div>
<div><dt>Deposit</dt><dd id="amount"></dd></div><div><dt>Expires</dt><dd id="expiry"></dd></div></dl>
<form id="continue" method="post"><button type="submit" disabled>Continue securely</button></form>
<button id="refresh" type="button">Refresh status</button></section></main><script src="/assets/guest.js" defer></script></body></html>
