name: CI

on:
  push:
    branches: [main, phase-7/codex-consolidated-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-state:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prove PowerShell handoff-state transitions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probePath = 'handoff/questions/zz-ci-windows-state-probe.md'

          function Get-StateSnapshot([string] $step) {
            $output = @(& .\state.ps1 6>&1 | ForEach-Object { "$_" })
            $line = @($output | Where-Object { $_ -match '^Historical records:' })
            $taskLine = @($output | Where-Object { $_ -match '^Current task: .+' })
            $lifecycleLine = @($output | Where-Object { $_ -match '^Lifecycle: .+' })
            $phaseLine = @($output | Where-Object { $_ -match '^Phase: \d+ · .+' })
            if ($line.Count -ne 1 -or $taskLine.Count -ne 1 -or $lifecycleLine.Count -ne 1 -or $phaseLine.Count -ne 1) {
              throw "$step diverged: expected one historical/task/lifecycle/phase line; got historical=$($line.Count) task=$($taskLine.Count) lifecycle=$($lifecycleLine.Count) phase=$($phaseLine.Count)"
            }
            if ($line[0] -notmatch '^Historical records: orders=(\d+) total \((\d+) lack legacy MERGED marker\) reviews=(\d+) total questions=(\d+) without legacy resolution marker \((\d+) total\)$') {
              throw "$step diverged: could not parse Historical records line: $($line[0])"
            }
            $ordersTotal = [int] $Matches[1]
            $ordersLegacyUnclosed = [int] $Matches[2]
            $reviewsTotal = [int] $Matches[3]
            $questionsUnresolved = [int] $Matches[4]
            $questionsTotal = [int] $Matches[5]
            $lifecycle = $lifecycleLine[0].Substring('Lifecycle: '.Length)
            if ($phaseLine[0] -notmatch '^Phase: (\d+) · (.+)$' -or $Matches[2] -ne $lifecycle) {
              throw "$step diverged: phase lifecycle does not match '$($lifecycleLine[0])': $($phaseLine[0])"
            }
            return [pscustomobject]@{
              Output = $output
              Line = $line[0]
              OrdersTotal = $ordersTotal
              OrdersLegacyUnclosed = $ordersLegacyUnclosed
              ReviewsTotal = $reviewsTotal
              QuestionsUnresolved = $questionsUnresolved
              QuestionsTotal = $questionsTotal
            }
          }

          function Assert-Counts(
            [string] $step,
            [object] $actual,
            [object] $baseline,
            [int] $questionUnresolvedDelta,
            [int] $questionTotalDelta
          ) {
            $sameNonQuestionCounts =
              $actual.OrdersTotal -eq $baseline.OrdersTotal -and
              $actual.OrdersLegacyUnclosed -eq $baseline.OrdersLegacyUnclosed -and
              $actual.ReviewsTotal -eq $baseline.ReviewsTotal
            $expectedQuestionsUnresolved = $baseline.QuestionsUnresolved + $questionUnresolvedDelta
            $expectedQuestionsTotal = $baseline.QuestionsTotal + $questionTotalDelta
            if (
              -not $sameNonQuestionCounts -or
              $actual.QuestionsUnresolved -ne $expectedQuestionsUnresolved -or
              $actual.QuestionsTotal -ne $expectedQuestionsTotal
            ) {
              throw "$step diverged: expected question deltas unresolved=$questionUnresolvedDelta total=$questionTotalDelta from '$($baseline.Line)', got '$($actual.Line)'"
            }
          }

          $originalPath = $env:PATH
          $childPowerShell = (Get-Process -Id $PID).Path
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $childPowerShell
          $startInfo.WorkingDirectory = (Get-Location).Path
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.ArgumentList.Add('-NoProfile')
          $startInfo.ArgumentList.Add('-ExecutionPolicy')
          $startInfo.ArgumentList.Add('Bypass')
          $startInfo.ArgumentList.Add('-File')
          $startInfo.ArgumentList.Add((Resolve-Path .\state.ps1).Path)
          $startInfo.Environment['PATH'] = [Environment]::SystemDirectory

          $failedReportProcess = [System.Diagnostics.Process]::Start($startInfo)
          $failedReportStdout = $failedReportProcess.StandardOutput.ReadToEnd()
          $failedReportStderr = $failedReportProcess.StandardError.ReadToEnd()
          $failedReportProcess.WaitForExit()
          $failedReportExit = $failedReportProcess.ExitCode
          $failedReportText = "$failedReportStdout`n$failedReportStderr"

          if ($env:PATH -ne $originalPath) {
            throw 'missing-Git report diverged: parent PATH changed'
          }
          if ($failedReportExit -eq 0) {
            throw 'missing-Git report diverged: incomplete child report returned exit 0'
          }
          if ($failedReportText -match '(?m)^Referee:') {
            throw 'missing-Git report diverged: incomplete child emitted the completion footer'
          }
          if ($failedReportText -notmatch 'YELLOW state report failed:') {
            throw 'missing-Git report diverged: labelled failure was absent'
          }

          $afterFailedReport = Get-StateSnapshot 'missing-Git environment restoration'

          if (Test-Path -LiteralPath $probePath) {
            throw "baseline diverged: probe already exists at $probePath"
          }

          $baseline = Get-StateSnapshot 'baseline'
          try {
            Set-Content -LiteralPath $probePath -Value '# Windows state CI probe'
            $unmarked = Get-StateSnapshot 'unmarked question'
            Assert-Counts 'unmarked question' $unmarked $baseline 1 1
            if ($unmarked.Output -match [regex]::Escape($probePath)) {
              throw "unmarked question diverged: historical probe leaked into the current-task listing"
            }

            Add-Content -LiteralPath $probePath -Value '## RESOLVED'
            $resolved = Get-StateSnapshot 'resolved question'
            Assert-Counts 'resolved question' $resolved $baseline 0 1

            Set-Content -LiteralPath $probePath -Value '# Windows state CI probe', '## RATIFIED'
            $ratified = Get-StateSnapshot 'ratified question'
            Assert-Counts 'ratified question' $ratified $baseline 0 1

            Set-Content -LiteralPath $probePath -Value '# Windows state CI probe', 'This line contains ## RESOLVED inside it.'
            $nearMiss = Get-StateSnapshot 'inline-marker near-miss'
            Assert-Counts 'inline-marker near-miss' $nearMiss $baseline 1 1
            if ($nearMiss.Output -match [regex]::Escape($probePath)) {
              throw "inline-marker near-miss diverged: historical probe leaked into the current-task listing"
            }
          } finally {
            Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
          }

          $restored = Get-StateSnapshot 'probe cleanup'
          if ($restored.Line -ne $baseline.Line) {
            throw "probe cleanup diverged: expected '$($baseline.Line)', got '$($restored.Line)'"
          }

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Reject UTF-8 BOMs
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(mktemp)"
          trap 'rm -f "$tracked_files"' EXIT
          git ls-files -z > "$tracked_files"

          found=0
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]] && [[ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" == "efbbbf" ]]; then
              echo "UTF-8 BOM: $file"
              found=1
            fi
          done < "$tracked_files"
          exit "$found"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency licenses
        run: bun run license-check

      - name: Audit dependency vulnerabilities
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  container-smoke:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build application image
        run: docker build --tag yellow-ci-app:${{ github.sha }} .

      - name: Start application container
        run: >-
          docker run --detach
          --name yellow-ci-health
          --publish 127.0.0.1::3000
          yellow-ci-app:${{ github.sha }}

      - name: Verify exact health response
        shell: bash
        run: |
          set -euo pipefail
          if ! app_address="$(docker port yellow-ci-health 3000/tcp 2>/dev/null)"; then
            echo "yellow-ci-health has no published application address" >&2
            exit 1
          fi
          if [[ -z "$app_address" ]]; then
            echo "yellow-ci-health has no published application address" >&2
            exit 1
          fi

          for attempt in {1..30}; do
            status=""
            if ! status="$(curl --silent --show-error --output /tmp/yellow-health-body --write-out '%{http_code}' "http://${app_address}/health")"; then
              status=""
            fi
            body=""
            if [[ -f /tmp/yellow-health-body ]]; then
              body="$(cat /tmp/yellow-health-body)"
            fi
            if [[ "$status" == "200" && "$body" == '{"status":"ok"}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs yellow-ci-health
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force yellow-ci-health || true

  database:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: yellow-ci-database
      YELLOW_DATABASE_NAME: yellow_ci_deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install frozen dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt

      - name: Generate isolated database authority
        shell: bash
        run: |
          set -euo pipefail
          deploy_password="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          runtime_password="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          registrar_password="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          if [[ "$deploy_password" == "$runtime_password" || "$deploy_password" == "$registrar_password" || "$runtime_password" == "$registrar_password" ]]; then exit 1; fi
          echo "::add-mask::$deploy_password"
          echo "::add-mask::$runtime_password"
          echo "::add-mask::$registrar_password"
          {
            echo "YELLOW_DEPLOY_DATABASE_PASSWORD=$deploy_password"
            echo "YELLOW_RUNTIME_DATABASE_PASSWORD=$runtime_password"
            echo "YELLOW_EXTENSION_REGISTRAR_DATABASE_PASSWORD=$registrar_password"
          } >> "$GITHUB_ENV"

      - name: Start pinned PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach postgres
          for attempt in {1..30}; do
            container_id="$(docker compose ps --quiet postgres)"
            health=""
            if [[ -n "$container_id" ]]; then
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            fi
            if [[ "$health" == "healthy" ]]; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Resolve PostgreSQL address through Compose
        shell: bash
        run: |
          set -euo pipefail
          if ! postgres_address="$(docker compose port postgres 5432 2>/dev/null)"; then
            echo "postgres service has no published database address" >&2
            exit 1
          fi
          if [[ -z "$postgres_address" ]]; then
            echo "postgres service has no published database address" >&2
            exit 1
          fi

          {
            echo "POSTGRES_ADDRESS=${postgres_address}"
            echo "ADMIN_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/postgres"
            echo "DEPLOYMENT_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/yellow_ci_deployment"
            echo "DEPLOYMENT_RUNTIME_URL=postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${postgres_address}/yellow_ci_deployment"
            echo "DEPLOYMENT_REGISTRAR_URL=postgres://yellow_extension_registrar:${YELLOW_EXTENSION_REGISTRAR_DATABASE_PASSWORD}@${postgres_address}/yellow_ci_deployment"
            echo "INVARIANT_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/yellow_ci_invariant"
            echo "INVARIANT_RUNTIME_URL=postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${postgres_address}/yellow_ci_invariant"
            echo "YELLOW_DEPLOY_DATABASE_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/postgres"
            echo "YELLOW_MIGRATION_TEST_ADMIN_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/postgres"
            echo "YELLOW_SEED_TEST_ADMIN_URL=postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/postgres"
          } >> "$GITHUB_ENV"

      - name: Provision exact database authority roles
        shell: bash
        run: |
          set -euo pipefail
          postgres_address="$(docker compose port postgres 5432)"
          YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${postgres_address}/${YELLOW_DATABASE_NAME}" \
          YELLOW_RUNTIME_DATABASE_PASSWORD="$YELLOW_RUNTIME_DATABASE_PASSWORD" \
          YELLOW_EXTENSION_REGISTRAR_DATABASE_PASSWORD="$YELLOW_EXTENSION_REGISTRAR_DATABASE_PASSWORD" \
            bun scripts/provision-local-database-authority.ts

      - name: Execute isolated Phase 3 database proofs
        shell: bash
        run: |
          YELLOW_PHASE3_GATE_DEPLOY_URL="$ADMIN_URL" \
          YELLOW_PHASE3_GATE_RUNTIME_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/postgres" \
          YELLOW_PHASE3_GATE_REGISTRAR_URL="postgres://yellow_extension_registrar:${YELLOW_EXTENSION_REGISTRAR_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/postgres" \
          YELLOW_PHASE3_GATE_PASSWORD='Order079-CI-Proof-Only!' \
            bun run test:phase3-gate

      - name: Run migration integration suite
        shell: bash
        run: |
          set -euo pipefail
          YELLOW_DEPLOY_DATABASE_URL="$ADMIN_URL" \
          YELLOW_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/postgres" \
          YELLOW_REQUIRE_MIGRATION_DB=1 \
          YELLOW_REQUIRE_ORDER434_DATABASE=1 \
          YELLOW_ORDER434_MIGRATIONS_DIR="$GITHUB_WORKSPACE/migrations" \
          YELLOW_ORDER434_PG_DUMP_COMPOSE=1 \
            bun test tests/migrate.integration.test.ts

      - name: Run seed integration suite
        run: bun run test:db:seed

      - name: Prove Order434 native fiscal suite on a fresh migrated 78 database
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          native_template="yellow_ci_order434_native_template"
          native_clones=()
          trap 'for native_clone in "${native_clones[@]}"; do docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 --command "DROP DATABASE IF EXISTS ${native_clone} WITH (FORCE)"; done; docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 --command "DROP DATABASE IF EXISTS ${native_template} WITH (FORCE)"' EXIT
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "DROP DATABASE IF EXISTS ${native_template} WITH (FORCE)"
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE ${native_template}"
          export YELLOW_REQUIRE_ORDER434_DATABASE=1
          export YELLOW_REQUIRE_ORDER434_NATIVE_ACCOUNTING_DATABASE=1
          export YELLOW_REQUIRE_ORDER434_NATIVE_ISSUANCE_DATABASE=1
          export YELLOW_ORDER434_MIGRATIONS_DIR="$GITHUB_WORKSPACE/migrations"
          export YELLOW_ORDER434_PG_DUMP_COMPOSE=1
          YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${native_template}" \
          YELLOW_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${native_template}" \
            bun run db:migrate
          clone_index=0
          for proof_file in \
            tests/india-gst-accommodation-ordinary-regime-evidence.integration.test.ts \
            tests/india-native-fiscal-source-completion.integration.test.ts \
            tests/india-native-fiscal-accounting.integration.test.ts \
            tests/india-native-fiscal-preparation.integration.test.ts \
            tests/india-native-fiscal-source-locks.integration.test.ts \
            tests/india-native-fiscal-completion.integration.test.ts; do
            clone_index=$((clone_index + 1))
            native_clone="yellow_ci_order434_native_${clone_index}"
            native_clones+=("$native_clone")
            docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
              --command "CREATE DATABASE ${native_clone} TEMPLATE ${native_template}"
            export YELLOW_ORDER434_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${native_clone}"
            export YELLOW_ORDER434_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${native_clone}"
            export YELLOW_ORDER434_NATIVE_ACCOUNTING_DEPLOY_DATABASE_URL="$YELLOW_ORDER434_DEPLOY_DATABASE_URL"
            export YELLOW_ORDER434_NATIVE_ACCOUNTING_RUNTIME_DATABASE_URL="$YELLOW_ORDER434_RUNTIME_DATABASE_URL"
            export YELLOW_ORDER434_NATIVE_ISSUANCE_RUNTIME_DATABASE_URL="$YELLOW_ORDER434_RUNTIME_DATABASE_URL"
            printf 'Order434 native proof: %s\n' "$proof_file"
            bun test "$proof_file"
            docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
              --command "DROP DATABASE IF EXISTS ${native_clone} WITH (FORCE)"
          done

          # Required Order440 proof uses the same pristine migrated template,
          # never a tenant fixture left behind by the preceding native suites.
          wire_database="yellow_order440_ci"
          native_clones+=("$wire_database")
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE ${wire_database} TEMPLATE ${native_template}"
          YELLOW_ORDER440_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${wire_database}" \
          YELLOW_ORDER440_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${wire_database}" \
          YELLOW_REQUIRE_ORDER440_DATABASE=1 \
            bun test tests/india-irp-issued-wire-candidate.integration.test.ts
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "DROP DATABASE ${wire_database} WITH (FORCE)"

          # Q201 proves legacy retention and atomic canonical 77-to-78 upgrade.
          durable_database="yellow_order440_durable_ci"
          native_clones+=("$durable_database")
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE ${durable_database}"
          durable_migrations="$(mktemp -d "$RUNNER_TEMP/yellow-order440-prefix77.XXXXXX")"
          for migration in "$GITHUB_WORKSPACE"/migrations/*.sql; do
            filename="$(basename "$migration")"
            if (( 10#${filename:0:4} <= 77 )); then cp "$migration" "$durable_migrations/$filename"; fi
          done
          YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${durable_database}" \
          YELLOW_ORDER440_PRE_MIGRATIONS_DIR="$durable_migrations" \
            bun -e 'import { runMigrations } from "./scripts/migrate"; const result = await runMigrations({ databaseUrl: process.env.YELLOW_DEPLOY_DATABASE_URL, migrationsDirectory: process.env.YELLOW_ORDER440_PRE_MIGRATIONS_DIR }); if (result.discoveredFiles !== 77) throw new Error("Expected the exact prefix-77 predecessor");'
          YELLOW_ORDER440_DURABLE_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${durable_database}" \
          YELLOW_ORDER440_DURABLE_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${durable_database}" \
          YELLOW_REQUIRE_ORDER440_DURABILITY=1 \
            bun test tests/fiscal-submission-durability.integration.test.ts
          [[ "$durable_migrations" == "$RUNNER_TEMP"/yellow-order440-prefix77.* ]]
          rm -r -- "$durable_migrations"
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command "DROP DATABASE ${durable_database} WITH (FORCE)"

      - name: Prove native fiscal release containment on fresh and upgraded databases
        shell: bash
        run: |
          set -euo pipefail
          export YELLOW_DEPLOY_DATABASE_URL="$ADMIN_URL"
          export YELLOW_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/postgres"
          export YELLOW_REQUIRE_NATIVE_FISCAL_CONTAINMENT=1 YELLOW_REQUIRE_BUILD_READINESS=1
          bun test tests/native-fiscal-release-containment.integration.test.ts tests/build-readiness.integration.test.ts

      - name: Prove released operational and tax compatibility with split runtime authority
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE yellow_ci_compatibility_unseeded'
          export YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/yellow_ci_compatibility_unseeded"
          export YELLOW_REQUIRE_PHASE5_JOURNEY=1 YELLOW_REQUIRE_FOLIO_TRANSFERS=1
          export YELLOW_REQUIRE_POSITIVE_TAX_CORRECTION=1 YELLOW_REQUIRE_ORDER408_DATABASE=1
          export YELLOW_REQUIRE_BUSINESS_DAY_SEAL=1 YELLOW_REQUIRE_STAY_CHECKIN=1
          export YELLOW_REQUIRE_CHECKOUT=1 YELLOW_REQUIRE_SECURITY_DEFINER=1
          bun run db:migrate
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE yellow_ci_compatibility TEMPLATE yellow_ci_compatibility_unseeded'
          export YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/yellow_ci_compatibility"
          bun run db:seed
          proof_index=0
          for proof_file in \
            tests/phase-5-financial-journey.integration.test.ts \
            tests/financial-folio-transfers.integration.test.ts \
            tests/positive-tax-correction.integration.test.ts \
            tests/india-final-component-tax-correction.integration.test.ts \
            tests/business-day-seal.integration.test.ts \
            tests/stay-checkin.integration.test.ts \
            tests/stay-checkout.integration.test.ts \
            tests/security-definer-containment.integration.test.ts \
            tests/india-gst-accommodation-quoted-rate-applicability-recording.integration.test.ts \
            tests/india-gst-accommodation-final-component-tax-recording.integration.test.ts; do
            proof_index=$((proof_index + 1))
            proof_database="yellow_ci_compat_${proof_index}"
            case "$proof_file" in
              tests/india-gst-accommodation-quoted-rate-applicability-recording.integration.test.ts|tests/india-gst-accommodation-final-component-tax-recording.integration.test.ts)
                proof_template=yellow_ci_compatibility_unseeded ;;
              *) proof_template=yellow_ci_compatibility ;;
            esac
            docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
              --command "CREATE DATABASE \"${proof_database}\" TEMPLATE \"${proof_template}\""
            export YELLOW_DEPLOY_DATABASE_URL="postgres://yellow_deploy:${YELLOW_DEPLOY_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${proof_database}"
            export YELLOW_RUNTIME_DATABASE_URL="postgres://yellow_runtime:${YELLOW_RUNTIME_DATABASE_PASSWORD}@${POSTGRES_ADDRESS}/${proof_database}"
            export YELLOW_FOLIO_TRANSFERS_URL="$YELLOW_RUNTIME_DATABASE_URL"
            export YELLOW_ORDER400_DATABASE_URL="$YELLOW_DEPLOY_DATABASE_URL"
            export YELLOW_ORDER400_RUNTIME_DATABASE_URL="$YELLOW_RUNTIME_DATABASE_URL"
            export YELLOW_ORDER367_DATABASE_URL="$YELLOW_DEPLOY_DATABASE_URL"
            export YELLOW_ORDER367_RUNTIME_DATABASE_URL="$YELLOW_RUNTIME_DATABASE_URL"
            printf 'Isolated compatibility proof: %s\n' "$proof_file"
            bun test "$proof_file"
            docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 \
              --command "DROP DATABASE \"${proof_database}\" WITH (FORCE)"
          done

      - name: Create fresh acceptance databases
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql --username yellow_deploy --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS yellow_ci_deployment WITH (FORCE);
          CREATE DATABASE yellow_ci_deployment;
          DROP DATABASE IF EXISTS yellow_ci_invariant WITH (FORCE);
          CREATE DATABASE yellow_ci_invariant;
          SQL

      - name: Prove deployment migration and seed
        run: |
          export YELLOW_DEPLOY_DATABASE_URL="$DEPLOYMENT_URL"
          export YELLOW_RUNTIME_DATABASE_URL="$DEPLOYMENT_RUNTIME_URL"
          export YELLOW_EXTENSION_REGISTRAR_DATABASE_URL="$DEPLOYMENT_REGISTRAR_URL"
          export YELLOW_DATABASE_ACCEPTANCE_URL="$DEPLOYMENT_URL"
          export YELLOW_SCHEMA_DATABASE=yellow_ci_deployment
          bun run db:migrate
          bun run db:seed
          bun run test:database
          bun run schema:check

      - name: Prove invariant database through canonical referee
        shell: bash
        run: |
          set -euo pipefail
          export YELLOW_DEPLOY_DATABASE_URL="$INVARIANT_URL"
          export YELLOW_RUNTIME_DATABASE_URL="$INVARIANT_RUNTIME_URL"
          export YELLOW_DSN="$INVARIANT_URL"
          bun run db:migrate
          docker compose exec -T postgres psql --username yellow_deploy --dbname yellow_ci_invariant --set ON_ERROR_STOP=1 < tests/seed_fixture.sql
          python tests/run_invariants.py yellow_ci_invariant

      - name: Start application and verify exact health plus database-backed runtime
        shell: bash
        run: |
          set -euo pipefail
          proof_directory="$(mktemp -d)"
          trap 'rm -rf "$proof_directory"' EXIT

          review_password="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          approver_password="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          token_secret="$(bun -e 'const b=crypto.getRandomValues(new Uint8Array(48));process.stdout.write(Buffer.from(b).toString("base64url"));')"
          if [[ "$review_password" == "$approver_password" ]]; then exit 1; fi
          echo "::add-mask::$review_password"
          echo "::add-mask::$approver_password"
          echo "::add-mask::$token_secret"

          YELLOW_DEPLOY_DATABASE_URL="$DEPLOYMENT_URL" \
          YELLOW_REVIEW_PASSWORD="$review_password" \
          YELLOW_REVIEW_APPROVER_PASSWORD="$approver_password" \
            bun scripts/seed-review.ts

          export YELLOW_BUILD_SHA="$(git rev-parse HEAD)"
          export YELLOW_OPERATOR_WORKBENCH=1
          export YELLOW_HOLD_EXPIRY_WORKER=1
          export YELLOW_AVAILABILITY_PROJECTION_WORKER=1
          export YELLOW_TOKEN_SECRET="$token_secret"
          docker compose up --detach app
          if ! app_address="$(docker compose port app 3000 2>/dev/null)"; then
            echo "app service has no published application address" >&2
            exit 1
          fi
          if [[ -z "$app_address" ]]; then
            echo "app service has no published application address" >&2
            exit 1
          fi

          app_ready=0
          for attempt in {1..30}; do
            status=""
            if ! status="$(curl --silent --show-error --output "$proof_directory/health.json" --write-out '%{http_code}' "http://${app_address}/health")"; then
              status=""
            fi
            body=""
            if [[ -f "$proof_directory/health.json" ]]; then
              body="$(cat "$proof_directory/health.json")"
            fi
            if [[ "$status" == "200" && "$body" == '{"status":"ok"}' ]]; then
              app_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$app_ready" != "1" ]]; then
            echo "application did not reach exact health" >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 10 \
            "http://${app_address}/ready" --output "$proof_directory/readiness.json"
          READY_FILE="$proof_directory/readiness.json" bun -e '
            const body = await Bun.file(process.env.READY_FILE!).json();
            if (body.status !== "ready" || body.build?.revision !== process.env.YELLOW_BUILD_SHA
                || body.build?.expectedMigrationFrontier !== 78
                || body.target !== "yellow_runtime_database") process.exit(1);
          '

          LOGIN_PASSWORD="$review_password" LOGIN_FILE="$proof_directory/login-request.json" bun -e '
            await Bun.write(process.env.LOGIN_FILE!, JSON.stringify({
              tenant: "yellow-demo", email: "operator@yellow.local", password: process.env.LOGIN_PASSWORD,
            }));
          '
          login_status="$(curl --silent --show-error \
            --output "$proof_directory/login-response.json" --write-out '%{http_code}' \
            --header 'content-type: application/json' --data-binary "@$proof_directory/login-request.json" \
            "http://${app_address}/api/v1/auth/local:login")"
          if [[ "$login_status" != "200" ]]; then
            echo "database-backed local login returned HTTP $login_status" >&2
            exit 1
          fi
          access_token="$(LOGIN_FILE="$proof_directory/login-response.json" bun -e '
            const body = await Bun.file(process.env.LOGIN_FILE!).json();
            if (typeof body.accessToken !== "string" || body.accessToken.length < 32 || body.tokenType !== "Bearer") {
              process.exit(1);
            }
            process.stdout.write(body.accessToken);
          ')"
          echo "::add-mask::$access_token"
          AUTH_TOKEN="$access_token" AUTH_FILE="$proof_directory/auth.curl" bun -e '
            await Bun.write(process.env.AUTH_FILE!, `header = "Authorization: Bearer ${process.env.AUTH_TOKEN}"\n`);
          '

          status_status="$(curl --silent --show-error --config "$proof_directory/auth.curl" \
            --output "$proof_directory/system-status.json" --write-out '%{http_code}' \
            "http://${app_address}/api/v1/properties/4518a22f-b455-54c6-a50a-4584383749b9/system-status")"
          if [[ "$status_status" != "200" ]]; then
            echo "authenticated tenant database probe returned HTTP $status_status" >&2
            exit 1
          fi
          STATUS_FILE="$proof_directory/system-status.json" YELLOW_DATABASE_NAME="$YELLOW_DATABASE_NAME" bun -e '
            const body = await Bun.file(process.env.STATUS_FILE!).json();
            if (body?.live?.database?.state !== "operational"
                || body.live.database.tenantContext !== true
                || body.live.database.database !== process.env.YELLOW_DATABASE_NAME
                || body?.live?.workers?.holdExpiry !== "configured"
                || body.live.workers.availabilityProjection !== "configured") {
              process.exit(1);
            }
          '

          projection_ready=0
          for attempt in {1..30}; do
            cursor_exists="$(docker compose exec -T postgres psql --username yellow_deploy \
              --dbname "$YELLOW_DATABASE_NAME" --tuples-only --no-align --command \
              "SELECT EXISTS (SELECT 1 FROM consumer_cursor WHERE consumer = 'availability-projection')")"
            if [[ "$cursor_exists" == "t" ]]; then
              projection_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$projection_ready" != "1" ]]; then
            echo "availability projection worker did not establish its runtime database cursor" >&2
            exit 1
          fi

          runtime_sessions="$(docker compose exec -T postgres psql --username yellow_deploy \
            --dbname "$YELLOW_DATABASE_NAME" --tuples-only --no-align --command \
            "SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND usename = 'yellow_runtime'")"
          if [[ ! "$runtime_sessions" =~ ^[0-9]+$ || "$runtime_sessions" -lt 4 ]]; then
            echo "runtime startup did not establish the application and worker database sessions" >&2
            exit 1
          fi

      - name: Print database logs on failure
        if: failure()
        run: docker compose logs --no-color postgres app

      - name: Remove database stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  local-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: yellow-review
      YELLOW_DATABASE_NAME: yellow_dev
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install frozen verification dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt

      - name: Prove the supported local launcher, canonical referee, readiness and login
        run: ./scripts/local-review.sh start

      - name: Verify local status after startup
        run: ./scripts/local-review.sh status

      - name: Stop local preview
        if: always()
        run: |
          if [ -f .yellow/runtime-database-authority.env ]; then
            ./scripts/local-review.sh stop
          fi
