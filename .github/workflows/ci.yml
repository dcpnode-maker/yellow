name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject UTF-8 BOMs
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(mktemp)"
          trap 'rm -f "$tracked_files"' EXIT
          git ls-files -z > "$tracked_files"

          found=0
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]] && [[ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" == "efbbbf" ]]; then
              echo "UTF-8 BOM: $file"
              found=1
            fi
          done < "$tracked_files"
          exit "$found"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency licenses
        run: bun run license-check

      - name: Audit dependency vulnerabilities
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  container-smoke:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build application image
        run: docker build --tag yellow-ci-app:${{ github.sha }} .

      - name: Start application container
        run: >-
          docker run --detach
          --name yellow-ci-health
          --publish 3000:3000
          yellow-ci-app:${{ github.sha }}

      - name: Verify exact health response
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output /tmp/yellow-health-body --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
            body="$(cat /tmp/yellow-health-body 2>/dev/null || true)"
            if [[ "$status" == "200" && "$body" == '{"status":"ok"}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs yellow-ci-health
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force yellow-ci-health || true

  database:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: yellow-ci-database
      ADMIN_URL: postgres://yellow:yellow@127.0.0.1:5442/postgres
      DEPLOYMENT_URL: postgres://yellow:yellow@127.0.0.1:5442/yellow_ci_deployment
      INVARIANT_URL: postgres://yellow:yellow@127.0.0.1:5442/yellow_ci_invariant
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install frozen dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt

      - name: Start pinned PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach postgres
          for attempt in {1..30}; do
            container_id="$(docker compose ps --quiet postgres)"
            health=""
            if [[ -n "$container_id" ]]; then
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            fi
            if [[ "$health" == "healthy" ]]; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run migration integration suite
        env:
          YELLOW_MIGRATION_TEST_ADMIN_URL: ${{ env.ADMIN_URL }}
        run: bun run test:db:migrate

      - name: Run seed integration suite
        env:
          YELLOW_SEED_TEST_ADMIN_URL: ${{ env.ADMIN_URL }}
        run: bun run test:db:seed

      - name: Create fresh acceptance databases
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql --username yellow --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS yellow_ci_deployment WITH (FORCE);
          CREATE DATABASE yellow_ci_deployment;
          DROP DATABASE IF EXISTS yellow_ci_invariant WITH (FORCE);
          CREATE DATABASE yellow_ci_invariant;
          SQL

      - name: Prove deployment migration and seed
        env:
          DATABASE_URL: ${{ env.DEPLOYMENT_URL }}
          YELLOW_DATABASE_ACCEPTANCE_URL: ${{ env.DEPLOYMENT_URL }}
          YELLOW_SCHEMA_DATABASE: yellow_ci_deployment
        run: |
          bun run db:migrate
          bun run db:seed
          bun run test:database
          bun run schema:check

      - name: Start application and verify exact health
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach app
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output /tmp/yellow-health-body --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
            body="$(cat /tmp/yellow-health-body 2>/dev/null || true)"
            if [[ "$status" == "200" && "$body" == '{"status":"ok"}' ]]; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Prove invariant database through canonical referee
        shell: bash
        env:
          DATABASE_URL: ${{ env.INVARIANT_URL }}
          YELLOW_DSN: dbname=yellow_ci_invariant user=yellow password=yellow host=127.0.0.1 port=5442
        run: |
          set -euo pipefail
          bun run db:migrate
          docker compose exec -T postgres psql --username yellow --dbname yellow_ci_invariant --set ON_ERROR_STOP=1 < tests/seed_fixture.sql
          python tests/run_invariants.py yellow_ci_invariant

      - name: Print database logs on failure
        if: failure()
        run: docker compose logs --no-color postgres app

      - name: Remove database stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
