name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject UTF-8 BOMs
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(mktemp)"
          trap 'rm -f "$tracked_files"' EXIT
          git ls-files -z > "$tracked_files"

          found=0
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]] && [[ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" == "efbbbf" ]]; then
              echo "UTF-8 BOM: $file"
              found=1
            fi
          done < "$tracked_files"
          exit "$found"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency licenses
        run: bun run license-check

      - name: Audit dependency vulnerabilities
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  container-smoke:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build application image
        run: docker build --tag yellow-ci-app:${{ github.sha }} .

      - name: Start application container
        run: >-
          docker run --detach
          --name yellow-ci-health
          --publish 3000:3000
          yellow-ci-app:${{ github.sha }}

      - name: Verify exact health response
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output /tmp/yellow-health-body --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
            body="$(cat /tmp/yellow-health-body 2>/dev/null || true)"
            if [[ "$status" == "200" && "$body" == '{"status":"ok"}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs yellow-ci-health
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force yellow-ci-health || true
